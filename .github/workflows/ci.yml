name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TECTONIC_VERSION: "0.15.0"
  TECTONIC_LINUX_SHA256: "875fbbc9ab48560d7776088c608e0beee49197b57ab4a2f6c5385b2c661c842f"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install verified Tectonic sidecar
        run: |
          curl --fail --location --show-error --output tectonic.tar.gz "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TECTONIC_LINUX_SHA256}  tectonic.tar.gz" | sha256sum --check --strict
          tar -xzf tectonic.tar.gz
          mkdir -p src-tauri/binaries
          mv tectonic src-tauri/binaries/tectonic-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/tectonic-x86_64-unknown-linux-gnu

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test native code
        run: cargo test --manifest-path src-tauri/Cargo.toml